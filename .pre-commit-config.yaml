# Hooks de pre-commit. Instalar una vez con:
#   pip install -r requirements-dev.txt
#   pre-commit install
# Se ejecutan automáticamente en cada `git commit`.
repos:
  # Limpia los outputs de los notebooks antes de commitear (mantiene el repo ligero)
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  # Formateo de código con Ruff (compatible con Black, mucho más rápido).
  # Solo .py, igual que antes con Black; los notebooks los formatea VS Code.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-format
        types_or: [python, pyi]

  # Higiene básica de archivos
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
