# Entorno conda/mamba con las dependencias directas del proyecto.
# Crear con:  mamba env create -f environment.yml   (o conda)
# Cada dependencia fija el tope de versión mayor para evitar rupturas por saltos
# incompatibles (el smoke-test del CI cubre las rupturas dentro de un mismo major).
name: sales_env
channels:
  - conda-forge
dependencies:
  - python=3.11

  # Runtime del generador
  - pandas>=2.0,<3
  - numpy>=1.26,<2
  - python-dotenv>=1.0,<2

  # Notebooks / análisis de series de tiempo
  - jupyter>=1.0,<2
  - scipy>=1.11,<2
  - statsmodels>=0.14,<1
  - scikit-learn>=1.3,<2
  - matplotlib>=3.9,<4
  - plotly>=5.20,<7

  # Modelado (Fases 2–4 de la serie)
  - prophet>=1.1,<2       # Video 14
  - xgboost>=2.0,<4       # Video 16
  - lightgbm>=4.0,<5      # Video 16
  - pytorch>=2.2,<3       # Video 18 (Chronos); rueda CPU por defecto en conda-forge
  - optuna>=3.6,<5        # Video 21
  - streamlit>=1.30,<2    # Dashboard (Video 22): streamlit run app.py

  # Calidad de código y tests
  - black>=24,<27
  - mypy
  - pytest>=8.0,<10
  - pre-commit>=3.7,<5
  - nbstripout>=0.7,<1

  # Dependencias solo disponibles vía pip
  - pip
  - pip:
      - plotly-resampler>=0.9,<1
      - chronos-forecasting>=1.4,<3   # Video 18; descarga pesos de Hugging Face en el 1er uso
